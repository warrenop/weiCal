<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="brand-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Hex frame -->
  <polygon points="20,3 35,11.5 35,28.5 20,37 5,28.5 5,11.5"
           stroke="url(#brand-grad)" stroke-width="2" stroke-linejoin="round"
           filter="url(#brand-glow)"/>
  <!-- Mini chart bars + trend dot -->
  <g fill="url(#brand-grad)" filter="url(#brand-glow)">
    <rect x="11" y="23" width="3.6" height="8" rx="1"/>
    <rect x="18.2" y="17" width="3.6" height="14" rx="1"/>
    <rect x="25.4" y="12" width="3.6" height="19" rx="1"/>
    <circle cx="27.2" cy="11" r="1.6"/>
  </g>
</svg>
