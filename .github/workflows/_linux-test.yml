name: Linux build test (temp)

# Temporary workflow for iterating on the Linux PyInstaller build without
# burning version tags. Triggers on push to main. Delete once Linux is green
# and the fix is folded into release.yml.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_linux-test.yml'
      - 'mycal.spec'
      - 'mycal/**'
      - 'web/**'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Ubuntu version
        run: lsb_release -a || cat /etc/os-release

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (webkit2gtk + GObject introspection)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gir1.2-webkit2-4.1 \
            libwebkit2gtk-4.1-0 \
            libgirepository1.0-dev \
            gobject-introspection \
            libcairo2-dev \
            python3-dev \
            pkg-config

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # PyGObject 3.50+ requires girepository-2.0 which Ubuntu 24.04 doesn't
          # ship; pin to the last 1.0-compatible release.
          pip install "PyGObject<3.50" pycairo
          pip install -e ".[build]"

      - name: Build with PyInstaller
        run: pyinstaller mycal.spec --noconfirm

      - name: List build output
        run: ls -lhR dist/mycal | head -40

      - name: Smoke test the binary (--server mode)
        run: |
          set -e
          ./dist/mycal/mycal --server --port 8799 &
          APP_PID=$!
          # Wait up to 30s for the server to come up
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8799/api/meta > /dev/null; then
              echo "server up after ${i}s"; break
            fi
            sleep 1
          done
          echo "== /api/meta =="
          curl -s http://127.0.0.1:8799/api/meta | head -c 120; echo
          echo "== / =="
          curl -s -o /dev/null -w "status %{http_code}\n" http://127.0.0.1:8799/
          echo "== /api/transactions =="
          curl -s -o /dev/null -w "status %{http_code}\n" http://127.0.0.1:8799/api/transactions
          kill $APP_PID || true

      - name: Package
        run: |
          cd dist
          tar czf ../weiCal-linux-x64.tar.gz mycal
          ls -lh ../weiCal-linux-x64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: weiCal-linux-x64
          path: weiCal-linux-x64.tar.gz
          if-no-files-found: error
